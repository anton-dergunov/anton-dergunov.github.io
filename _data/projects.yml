- id: agents
  title: Agentic planning and context engineering
  kind: research
  blurb: 'A plain-text planning system with an LLM agent working beside you on the plan, and a capture
    mechanism that feeds it: a set protocol for saving anything from a phone, a browser or the laptop,
    prepared so that the agent can use it well. The capture pipeline''s design choices were made by measurement
    in experiments.'
  projects:
  - title: Agentic Org Planner
    repo: agentic-org-planner
    status: active
    tagline: 'Org-mode planning system for Emacs with an LLM agent working on the plan: it adds, files
      and edits tasks in your own files, every change reviewed as a diff.'
    summary: 'A planning system in plain-text Org files in which an LLM agent is a working participant.
      The agent knows the file and selection in front of you and the conventions of your plan; it adds
      and edits tasks and files what you captured during the day, showing each change as a diff to accept
      or reject. Underneath is a complete Emacs configuration that renders plans cleanly: an agenda with
      a timeline, a calendar, views of your tasks, Git sync and other features.'
    url: https://github.com/anton-dergunov/agentic-org-planner
    works_with:
