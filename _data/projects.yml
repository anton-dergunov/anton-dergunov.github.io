  - title: Agent context pipeline
    repo: agent-context-pipeline
    status: active
    tagline: Capture from any device, extraction to clean Markdown (web pages, PDFs, OCR, speech), and
      retrieval of related notes, delivered as an inbox a coding agent can file.
    summary: A self-hosted pipeline between what I come across during the day and the agent that files
      it. It captures from a phone, a browser or the command line, extracts and cleans the content, resolves
      links and titles, and looks up related notes ahead of the agent (BM25 recall, a cross-encoder rerank,
      an abstain gate). The agent's token cost with and without that lookup is measured in the design
      notes.
    url: https://github.com/anton-dergunov/agent-context-pipeline
    next: Cleaned of personal data and published.
