# Generated by `portfolio blog` from _structure/portfolio/projects.yaml -- do not edit.
groups:
- id: evaluation
  title: Evaluation and post-training
  kind: research
  projects:
  - title: LLM agent evaluation test bed
    repo: llm-agent-eval-testbed
    status: active
    tagline: 'Test bed for evaluating LLM agents: a support agent whose decisions are made by deterministic
      code, scored by checks, adversarial guardrails and a calibrated LLM judge.'
    summary: A support agent for a fictional neobank, built to iterate on how LLM agents are evaluated.
      The model only talks; plain Python makes every decision that touches money or account state, so
      prompt injection has no action to reach. An LLM plays the customer, and every simulated conversation
      is scored by deterministic checks and an LLM-as-judge.
    url: https://github.com/anton-dergunov/llm-agent-eval-testbed
    next: The evaluation experiments written up as a six-part series.
    topics:
    - llm-evaluation
    - llm-as-judge
    - agent-evaluation
    - ai-agents
    - guardrails
    - rag
    - prompt-injection
    - python
  - title: Mandarin Speech Coach
    repo: mandarin-speech-coach
    status: prototype
    tagline: 'Mandarin pronunciation coach: your pitch contour against a target phrase, aligned per character
      with Whisper, wav2vec2 CTC alignment and F0 tracking.'
    summary: A web app for Mandarin pronunciation practice. It transcribes a recording, aligns it to the
      target phrase character by character, and draws the pitch contour in tone colours, so the learner
      sees the evidence instead of a single score.
    url: https://github.com/anton-dergunov/mandarin-speech-coach
    next: An alignment evaluation harness, a surface-tone classifier, and a compact aligner fine-tuned
      to pinyin initials and finals.
    topics:
    - speech
    - pronunciation
    - mandarin
    - forced-alignment
    - wav2vec2
    - whisper
    - pitch-tracking
    - language-learning
- id: retrieval
  title: Retrieval and ranking
  kind: research
  projects:
  - title: Spoken Usage Retrieval
    repo: spoken-usage-retrieval
    status: active
    tagline: Retrieving and ranking authentic word and phrase usage from native speech.
    summary: Finds real examples of a word or phrase in native speech and plays the exact moment it is
      spoken. It builds a searchable corpus from the captions of curated YouTube channels, matches words
      and short phrases by surface form and morphology, and ranks and diversifies the results across videos
      behind a JSON API and a React player.
    url: https://github.com/anton-dergunov/spoken-usage-retrieval
    next: Forced alignment, learned ranking, and catalogues beyond Spanish.
    topics:
    - information-retrieval
    - ranking
    - search
    - speech
    - nlp
    - language-learning
    - python
    - react
  - title: Task Concept Retrieval
    repo: task-concept-retrieval
    status: active
    tagline: 'Given a short task description, retrieve the most appropriate concept from a fixed vocabulary
      of 4,257 visual symbols: hybrid lexical-semantic retrieval, embedding models, reranking, calibration,
      and abstention.'
    summary: 'A retrieval test bed: given a task headline from a planner, return the one icon that conveys
      it, or nothing. Icons are matched on generated descriptions instead of their names, no LLM runs
      on the query path, and a calibrated gate abstains when no icon is good enough.'
    url: https://github.com/anton-dergunov/task-concept-retrieval
    next: A labelled gold set of real task headlines, and a benchmark of embedding, reranking and fine-tuned
      matchers against it.
    topics:
    - information-retrieval
    - semantic-search
    - embeddings
    - sentence-embeddings
    - reranking
    - calibration
    - python
  - title: Interest-aligned vocabulary recommendation
    repo: interest-aligned-vocabulary-recommendation
    status: planned
    tagline: 'Vocabulary recommendation for a single learner: what would this person want to learn next,
      answered from their own multilingual vocabulary, with no crowd to pool.'
    summary: 'Recommenders for language learning usually ask what a learner does not know, pooled over
      many learners. With one user there is no interaction matrix, so the question becomes what this learner
      would want next, from three signals kept apart: topical relevance, difficulty and novelty. Design
      notes only so far.'
    url: https://github.com/anton-dergunov/interest-aligned-vocabulary-recommendation
    next: A first prototype (embed senses, cluster, propose, log every decision), evaluated within one
      subject as a crossover design.
    topics:
    - recommender-systems
    - cold-start
    - information-retrieval
    - language-learning
    - llm
    - nlp
    - sentence-embeddings
    - topic-modeling
- id: agents
  title: Agents and context engineering
  kind: research
  blurb: 'Preparing content so that an LLM agent can use it: extraction to clean Markdown, retrieval done
    ahead of the agent, and the token cost measured.'
  projects:
  - title: Agentic Org Planner
    repo: agentic-org-planner
    status: active
    tagline: Org-mode planning system for Emacs with an LLM agent that reads and edits the plan, its changes
      reviewed as diffs.
    summary: 'A complete Emacs configuration for planning in plain-text Org files: a visual agenda, schedule
      view, capture and saved searches. A Claude Code assistant runs beside it, aware of the file and
      selection in front of you, and proposes edits as diffs to accept or reject; a generated context
      file tells it the conventions of the plan it is editing.'
    url: https://github.com/anton-dergunov/agentic-org-planner
    next: The audit and route skills, which review the plan and file inbox items, moving into the repo.
    topics:
    - emacs
    - org-mode
    - ai-agents
    - claude-code
    - context-engineering
    - planning
    - productivity
  - title: Agent context pipeline
    repo: info-triage
    status: active
    tagline: Capture from any device, extraction to clean Markdown (web pages, PDFs, OCR, speech), and
      retrieval of related notes, delivered as an inbox a coding agent can file.
    summary: A self-hosted pipeline between what I come across during the day and the agent that files
      it. It captures from a phone, a browser or the command line, extracts and cleans the content, resolves
      links and titles, and looks up related notes ahead of the agent (BM25 recall, a cross-encoder rerank,
      an abstain gate). The agent's token cost with and without that lookup is measured in the design
      notes.
    next: Cleaned of personal data and published.
    topics:
    - context-engineering
    - ai-agents
    - information-extraction
    - pdf-extraction
    - ocr
    - speech-to-text
    - retrieval
    - self-hosted
    private: true
  - title: Agentic paper library
    repo: agentic-paper-library
    status: planned
    tagline: 'Research papers as context for a coding agent: arXiv, PDF and web articles converted to
      Markdown with equations, figures and page-numbered headings.'
    summary: 'The tooling behind my own paper library: converters that turn a paper into Markdown an agent
      can read and cite by section and page, a topic tree, and skills for adding papers, reading them
      with the agent and writing literature reviews.'
    next: Published without my own collection of papers.
    topics:
    - context-engineering
    - ai-agents
    - research-papers
    - pdf-extraction
    - claude-code
