- id: reading
  title: Reading research papers with LLM agents
  kind: research
  subtitle: Designed by measurement
  blurb: A set of tools for keeping your own library of research papers and reading it with the help of
    a coding agent, which finds new papers, explains them and answers questions across the whole library.
    Every part was designed by measurement (the text format the agent reads, the prompts, the models),
    and the experiments are in the repository. The library works on its own in Claude Code. To read a
    paper with its chat side by side, open it in Carrel on a tablet or a Mac, or in PDF Viewer for VS
    Code; in either, a citation in the chat opens the paper at the cited page.
  blurb_html: A set of tools for keeping your own library of research papers and reading it with the help
    of a coding agent, which finds new papers, explains them and answers questions across the whole library.
    Every part was designed by measurement (the text format the agent reads, the prompts, the models),
    and the experiments are in the repository. The library works on its own in Claude Code. To read a
    paper with its chat side by side, open it in <a href="#project-carrel"><em>Carrel</em></a> on a tablet
    or a Mac, or in <a href="#project-vscode-pdf-viewer"><em>PDF Viewer for VS Code</em></a>; in either,
    a citation in the chat opens the paper at the cited page.
