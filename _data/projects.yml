  - title: Agent context pipeline
    repo: agent-context-pipeline
    status: active
    tagline: Capture from any device, extraction to clean Markdown (web pages, PDFs, OCR, speech) and
      retrieval of related notes, delivered as an inbox a coding agent sorts into your plan in Agentic
      Org Planner.
    summary: 'The capture side of a planning system: a self-hosted pipeline between what you come across
      during the day and the agent that sorts it into your plan. It captures from a phone, a browser or
      the command line, extracts and cleans the content, resolves links and titles, and looks up related
      notes ahead of the agent (BM25 recall, a cross-encoder rerank, an abstain gate). In experiments
      it opened content the agent could not reach on its own, and the agent sorted the same items with
      30–40% fewer tokens and no exploratory searches.'
    url: https://github.com/anton-dergunov/agent-context-pipeline
    works_with:
