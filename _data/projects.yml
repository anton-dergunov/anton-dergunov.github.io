# Generated by `portfolio blog` from _structure/portfolio/projects.yaml -- do not edit.
groups:
- id: evaluation
  title: Evaluation and post-training
  kind: research
  projects:
  - title: LLM agent evaluation test bed
    repo: llm-agent-eval-testbed
    status: active
    tagline: 'Test bed for evaluating LLM agents: a support agent whose decisions are made by deterministic
      code, scored by checks, adversarial guardrails and a calibrated LLM judge.'
    summary: A support agent for a fictional neobank, built to iterate on how LLM agents are evaluated.
      The model only talks; plain Python makes every decision that touches money or account state, so
      prompt injection has no action to reach. An LLM plays the customer, and every simulated conversation
      is scored by deterministic checks and an LLM-as-judge.
    url: https://github.com/anton-dergunov/llm-agent-eval-testbed
    next: The evaluation experiments written up as a six-part series.
    topics:
    - llm-evaluation
    - llm-as-judge
    - agent-evaluation
    - ai-agents
    - guardrails
    - rag
    - prompt-injection
    - python
  - title: Mandarin Speech Coach
    repo: mandarin-speech-coach
    status: prototype
    tagline: 'Mandarin pronunciation practice that shows the evidence instead of a score: your pitch contour
      against a target phrase, aligned per character (Whisper, wav2vec2 CTC alignment, F0 tracking).'
    summary: A different way to practise Mandarin tones. Where pronunciation assessment usually returns
      a score, this shows the learner's own pitch contour against the target phrase, aligned character
      by character and drawn in tone colours, so what went wrong is visible. A recording is transcribed,
      force-aligned and pitch-tracked to produce it.
    url: https://github.com/anton-dergunov/mandarin-speech-coach
    next: An alignment evaluation harness, a surface-tone classifier, and a compact aligner fine-tuned
      to pinyin initials and finals.
    media:
    - type: image
      src: /images/projects/mandarin-speech-coach/demo.png
      caption: One phrase, your pitch contour against the target, aligned per character.
    topics:
    - speech
    - pronunciation
    - mandarin
    - forced-alignment
    - wav2vec2
    - whisper
    - pitch-tracking
    - language-learning
- id: retrieval
  title: Retrieval and ranking
  kind: research
  projects:
  - title: Spoken Usage Retrieval
    repo: spoken-usage-retrieval
    status: active
    tagline: Retrieving and ranking authentic word and phrase usage from native speech.
    summary: 'An information-retrieval system over native speech: it finds real uses of a word or phrase
      and plays the exact moment each is spoken. An indexing pipeline builds the corpus from the captions
      of curated YouTube channels; retrieval matches words and short phrases by surface form and by lemma,
      with analysers compared across ten languages; results are ranked and diversified across videos.
      Experiments on aligning speech to subtitles and on word-level translation alignment are kept in
      the repo.'
    url: https://github.com/anton-dergunov/spoken-usage-retrieval
    next: 'Human relevance judgments with a calibrated LLM judge, then multi-stage ranking: ranking features,
      a learned ranker and a multilingual reranker.'
    media:
    - type: image
      src: /images/projects/spoken-usage-retrieval/web-demo.webp
      caption: The web demo, searching Spanish speech for a phrase.
    topics:
    - information-retrieval
    - ranking
    - search
    - speech
    - forced-alignment
    - nlp
    - language-learning
    - python
  - title: Task Concept Retrieval
    repo: task-concept-retrieval
    status: active
    tagline: 'Given a short task description, retrieve the most appropriate concept from a fixed vocabulary
      of 4,257 visual symbols: hybrid lexical-semantic retrieval, embedding models, reranking, calibration,
      and abstention.'
    summary: 'A retrieval test bed: given a task headline from a planner, return the one icon that conveys
      it, or nothing. The matching signal is generated: a vision model describes each of the 4,257 icons
      (what it shows, which tasks it suits, which it does not), and that description, never the icon''s
      name, is what gets matched. No LLM runs on the query path, and a calibrated gate abstains when no
      icon is good enough.'
    url: https://github.com/anton-dergunov/task-concept-retrieval
    next: A second generation of icon descriptions, a labelled gold set of real task headlines, and a
      matcher fine-tuned on them, benchmarked against embedding and reranking baselines.
    topics:
    - information-retrieval
    - semantic-search
    - embeddings
    - sentence-embeddings
    - reranking
    - calibration
    - python
