  - title: Acervo
    repo: acervo-llm-dictionary
    status: active
    tagline: 'Personal dictionary whose content is generated by LLMs and multimodal models and approved
      by the learner: entries, pictures, voices, clips of native speech, audio loops and illustrated stories,
      tuned by experiment.'
    summary: A self-hosted, offline-first vocabulary store. Paste a word or the sentence you met it in;
      the entry is written for you and waits in an inbox until you approve it. Around the entry, models
      generate a picture for each sense and spoken audio, select clips of native speakers using the word
      on YouTube, and turn a handful of words into audio loops and illustrated stories. Where a model
      is trusted and where it is checked was decided by experiments kept in the repo.
