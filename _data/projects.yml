  - title: LexiBeat
    repo: lexibeat
    status: active
    tagline: 'Language-learning audio loops: your words spoken on a beat grid over procedural music, reproducible
      from a seed.'
    summary: 'Makes loops: a handful of words, each spoken in the language you are learning and followed
      by its translation, over a calm music bed. Speech lands on a known beat grid and the music is procedural
