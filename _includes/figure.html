<figure class="figure-frame">
  {%- if include.url %}
    <a href="{{ include.url }}"><img src="{{ include.src }}" alt="{{ include.alt }}" loading="lazy" decoding="async"></a>
  {%- else %}
    <img src="{{ include.src }}" alt="{{ include.alt }}" loading="lazy" decoding="async">
  {%- endif %}
  {%- if include.caption %}
  <figcaption>{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" }}</figcaption>
  {%- endif %}
</figure>
