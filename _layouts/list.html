---
layout: base
---
<div class="band">
  <div class="rail">
    {%- if page.rail_note %}<p class="rail-note">{{ page.rail_note }}</p>{%- endif %}
    {%- if page.rail_toc %}{% include toc.html html=content level=page.rail_toc %}{%- endif %}
  </div>
  <div class="body-col{% if page.body_class %} {{ page.body_class }}{% endif %}">
    {%- if page.title and page.hide_title != true %}<h1 class="page-title">{{ page.title }}</h1>{%- endif %}
    {{ content }}
  </div>
</div>
