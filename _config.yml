# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
locale                   : "en-US"
title                    : "Anton Dergunov"
title_separator          : "·"
name                     : "Anton Dergunov"
description              : "Notes on machine learning, information retrieval, and the tools I build."
url                      : https://anton-dergunov.github.io
baseurl                  : ""
repository               : "anton-dergunov/anton-dergunov.github.io"

author:
  name             : "Anton Dergunov"
  bio              : "machine learning engineer and applied scientist"
  github           : "anton-dergunov"
  linkedin         : "anton-dergunov"
  twitter          : "AntonDergunov"
  stackoverflow    : "1989308/anton-dergunov"
  medium           : "https://medium.com/@adergunov"

words_per_minute         : 200
future                   : false
timezone                 : Europe/London

# ---------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------
analytics:
  provider               : "google-analytics-4"
  google:
    tracking_id          : "G-4T875DSXFZ"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
encoding: "utf-8"
permalink: /:categories/:title/
excerpt_separator: "\n\n"

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - node_modules
  - vendor
  - .bundle
  - .jekyll-cache

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  math_engine: katex

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# ---------------------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
